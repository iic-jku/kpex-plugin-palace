[project]
name = "kpex-plugin-palace"
version = "0.3.0"
description = "Palace electrostatic input from KPEX PEX25D scenes: capacitance matrices by FEM"
authors = [{ name = "Martin Köhler", email = "info@martinjankoehler.com" }]
license = "GPL-3.0-or-later"
readme = "README.md"
requires-python = ">=3.12,<4.0"
keywords = ["pex", "parasitic", "extraction", "klayout", "palace", "fem", "capacitance"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = [
    "kpex>=0.12.0,<1",
    "kpex-plugin-gmsh>=0.3.0,<0.4",
]

[project.urls]
repository = "https://github.com/iic-jku/kpex-plugin-palace"

[project.entry-points."klayout_pex.exporters.v1"]
palace = "klayout_pex_plugins.palace:create_exporter"

[tool.poetry]
packages = [{ include = "klayout_pex_plugins/palace", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = "^9.0"
allure-pytest = ">=2.13.5"
coverage = ">=7.6.8"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
